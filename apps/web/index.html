<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPilot MVP</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        #chat { border: 1px solid #ccc; padding: 15px; min-height: 200px; margin-bottom: 15px; }
        .message { margin: 10px 0; }
        .user { color: #0066cc; }
        .assistant { color: #666; }
        input { width: 80%; padding: 8px; }
        button { padding: 8px 15px; }
        #schedule { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px; }
        .block { background: #f0f0f0; padding: 8px; margin: 5px 0; border-radius: 4px; }
        #view-controls button { padding: 8px 15px; margin-right: 5px; }
        #view-controls button.active { background: #0066cc; color: white; }
    </style>
</head>
<body>
    <h1>DayPilot MVP</h1>
    <div id="chat"></div>
    <input type="text" id="input" placeholder="输入任务，例如：周五前完成PPT，大概3小时">
    <button onclick="sendMessage()">发送</button>
    <div id="view-controls" style="display:none; margin-top: 20px;">
        <button onclick="switchView('timeline')" id="btn-timeline">时间轴</button>
        <button onclick="switchView('list')" id="btn-list" class="active">列表</button>
        <button onclick="switchView('card')" id="btn-card">卡片</button>
    </div>
    <div id="schedule"></div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const sessionId = 'web_' + Date.now();

        function addMessage(text, type) {
            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = 'message ' + type;
            msg.textContent = (type === 'user' ? '你: ' : 'AI: ') + text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            try {
                const res = await fetch(`${API_BASE}/api/intake`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, session_id: sessionId })
                });
                const data = await res.json();

                if (data.action === 'ask') {
                    addMessage(data.question, 'assistant');
                } else if (data.action === 'schedule') {
                    addMessage('任务已解析，正在生成日程...', 'assistant');
                    await generateSchedule(data.task);
                }
            } catch (err) {
                addMessage('错误: ' + err.message, 'assistant');
            }
        }

        async function generateSchedule(task) {
            try {
                const res = await fetch(`${API_BASE}/api/schedule`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task, busy_events: [], work_window: ['09:00', '18:00'] })
                });
                const data = await res.json();

                const scheduleDiv = document.getElementById('schedule');
                scheduleDiv.innerHTML = '<h3>生成的日程：</h3>';

                if (data.blocks.length === 0) {
                    scheduleDiv.innerHTML += '<p>无法在截止时间前安排任务</p>';
                } else {
                    data.blocks.forEach(block => {
                        const div = document.createElement('div');
                        div.className = 'block';
                        div.textContent = `${block.title}: ${block.start} - ${block.end} (${block.duration_minutes}分钟)`;
                        scheduleDiv.appendChild(div);
                    });
                }
            } catch (err) {
                addMessage('生成日程失败: ' + err.message, 'assistant');
            }
        }

        document.getElementById('input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
